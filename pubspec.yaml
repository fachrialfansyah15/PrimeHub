name: primehub
description: Aplikasi Nonton Film - UAS Pemrograman Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # API
  chopper: ^8.0.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Database & Auth
  supabase_flutter: ^2.5.0

  app_links: ^6.3.4

  # Routing
  go_router: ^17.2.3

  # Env
  flutter_dotenv: ^6.0.1

  # Image
  cached_network_image: ^3.3.1

  # Utils
  intl: ^0.20.2

  # URL Launcher
  url_launcher: ^6.3.0

  # YouTube Player
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  chopper_generator: ^8.0.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - .env